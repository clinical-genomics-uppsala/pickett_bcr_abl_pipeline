decimalPoint_format: ","

table_sample_merge:
  "L00X": # to remove SX_L00X from ending to enable groupingq
    - type: "regex"
      pattern: "S[0-9]{1,2}_L00[0-8]{1}"

custom_content:
  order:
    - fastqc
    - fastp
    - mosdepth
    - STAR
    - rseqc
    - samtools

table_columns_visible:
  FastQC:
    fastqc-percent_duplicates: False
    fastqc-percent_gc: False
    fastqc-avg_sequence_length: False
    fastqc-percent_fails: False
    fastqc-total_sequences: False
  fastp:
    fastp-pct_adapter: True
    fastp-pct_surviving: False
    fastp-after_filtering_gc_content: False
    fastp-filtering_result_passed_filter_reads: False
    fastp-after_filtering_q30_bases: False
    fastp-after_filtering_q30_rate: False
    pct_duplication: False
  mosdepth:
    mosdepth-median_coverage: True
    mosdepth-mean_coverage: False
    mosdepth-1_x_pc: False
    mosdepth-5_x_pc: False
    mosdepth-10_x_pc: False
    mosdepth-20_x_pc: False
    mosdepth-30_x_pc: False
    mosdepth-50_x_pc: False
  "Samtools: stats":
    samtools_stats-error_rate: False
    samtools_stats-non-primary_alignments: False
    samtools_stats-reads_mapped: False
    samtools_stats-reads_mapped_percent: False
    samtools_stats-reads_properly_paired_percent: False
    samtools_stats-reads_MQ0_percent: False
    samtools_stats-raw_total_sequences: True
  STAR:
    star-uniquely_mapped_percent: True
    star-uniquely_mapped: False
    star-mapped_percent: False

