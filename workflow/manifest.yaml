---
pipeline:
  id: wp2_abl
  name: pickett_bcr_abl_pipeline
  assay: bcr_abl
  genome_build: GRCh38

entrypoints:
  analysis: workflow/Snakefile
  background: workflow/Snakefile_background.smk
  references: null

layout:
  local_rules_dir: workflow/rules
  local_scripts_dir: workflow/scripts
  schemas_dir: workflow/schemas
  report: report/workflow.rst

rule_groups:
  common: workflow/rules/common.smk
  results: workflow/rules/results.smk
  variant_formatting: workflow/rules/bcftools.smk
  pdf_conversion: workflow/rules/convert_pdf.smk
  background_creation: workflow/rules/create_background_file.smk
  pisces_wrapper: workflow/rules/dotnet.smk
  multiqc_order: workflow/rules/sample_order_for_multiqc.smk
  summary_report: workflow/rules/summary_report.smk

hydra_modules:
  source: config.modules
  loader: hydra_genetics.utils.misc.get_module_snakefile
  local_module_root_config_key: hydra_local_path
  modules:
    - alignment
    - annotation
    - fusions
    - prealignment
    - qc
    - snv_indels

scripts:
  pipeline_specific:
    - workflow/scripts/create_background_file.py
    - workflow/scripts/summary_report.py
  shared_report_candidates:
    - workflow/scripts/sample_order_for_multiqc.py
  tested_scripts:
    - workflow/scripts/test_create_background_file.py
    - workflow/scripts/test_sample_order_for_multiqc.py

harmonization_notes:
  - This Pickett Miarka branch is the current wp2_abl baseline for harmonization.
  - Keep output manifest and generated copy-rule logic in workflow/rules/results.smk.
  - Background generation is a real second entrypoint and should stay documented.
  - sample_order_for_multiqc.py overlaps with sample_order_multiqc.py naming in other pipelines.
